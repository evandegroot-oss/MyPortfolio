    <main>
        <h2>Reach Out</h2>

        <form action="mailto:evan.degroot@ontariotechu.net" method="post" enctype="text/plain" name="form">
            <p>
                <label for="name">Name</label>
                <input type="text" name="name" size="32" required>
            </p>
             <p>
                <label for="email">Email</label>
                <input name="email" type="email" size="40" required>
            </p>

            <p>
                <label for="phone">Cell No.</label>
                <input type="tel" name="phone" size="20" required>
            </p>

            <p>
                <label for="comments">Comments?</label><br>
                <textarea name="comments" cols="60" rows="6"></textarea>
            </p>

            <p>
                <input type="submit" value="Submit">
            </p>
        </form>
    </main>
    
    <footer>
        <address>
            <p>Email: <a href="mailto:evan.degroot@ontariotechu.net">evan.degroot@ontariotechu.net</a></p>
