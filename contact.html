<!DOCTYPE html>
<!-- Sets the document as HTML5 -->

<html lang="en">
<!-- Starts the HTML doc and sets the language as English -->

<head>
<!-- Container for metadata, information about the webpage that is not directly displayed on the page -->

    <meta charset="UTF-8">
    <!-- Sets the character encoding, UTF-8 is a universal character encoding that supports almost every language, symbol and emoji -->

    <title>Evan DeGroot - Contact Me</title>
    <!-- Sets the title displayed in the browser tab -->

    <meta name="viewport" content="width=device-width">
    <!-- Sets the viewport width to the width of the device for responsive design -->

        <link href="css/full.css" rel="stylesheet" type="text/css" media="only screen and (min-width:960px)">
        <!-- Full-size monitor style sheet -->
   
        <link href="css/tablet.css" rel="stylesheet" type="text/css" media="only screen and (min-width:481px) and (max-width:960px)">
        <!-- Tablet style sheet -->
        
        <link href="css/phone.css" rel="stylesheet" type="text/css" media="only screen and (max-width:480px)">
        <!-- Phone style sheet -->
</head>
<!-- End of head section -->

<body>
<!-- All visible content of the webpage -->

    <header>
        <nav>
            <a class="button" href="index.html">Home</a>
            <a class="button" href="about.html">About Me</a>
            <a class="button" href="projects.html">Projects</a>
            <a class="button" href="contact.html">Contact Me</a>
        </nav>
        <!-- Navigation section of the page, contains links to other portfolio pages -->

        <h1>Contact Me</h1>
        <p>Evan DeGroot</p>
        <!-- Main heading and my name -->

    </header>
    <!-- End of header section -->

    <main>
    <!-- Main content of the webpage -->

        <h2>Reach Out</h2>
        <!-- H2 heading for the contact section -->

        <form action="mailto:evan.degroot@ontariotechu.net" method="post" enctype="text/plain" name="form">
            <!-- Contact form that sends the submitted information to my email -->

            <p>
                <label for="name">Name</label>
                <input type="text" name="name" id="name" size="32" required>
            </p>
            <!-- Name field, required before the form can be submitted -->

             <p>
                <label for="email">Email</label>
                <input name="email" id="email" type="email" size="40" required>
            </p>
            <!-- Email field, required and uses the email input type -->
            
            <p>
                <label for="phone">Cell No.</label>
                <input type="tel" name="phone" id="phone" size="20" required>
            </p>
            <!-- Cell phone field, required and uses the telephone input type -->
            
            <p>
                <label for="comments">Comments?</label><br>
                <textarea name="comments" id="comments" cols="60" rows="6"></textarea>
            </p>
            <!-- Comments field using a textarea for longer text -->
            
            <p>
                <input type="submit" value="Submit">
            </p>
            <!-- Submit button for the contact form -->

        </form>
        <!-- End of contact form -->

    </main>
    <!-- End of main content section -->

    <footer>
    <!-- Footer section of the webpage -->  

        <address>
            <p>Email: <a href="mailto:evan.degroot@ontariotechu.net">evan.degroot@ontariotechu.net</a></p>
        </address>
        <!-- Email address that can be clicked to send an email (address semantic tag) -->

        <p>&copy; 2026 Evan DeGroot</p>
        <!-- Copyright information for the website -->

    </footer>
    <!-- End of footer section -->

</body>
<!-- End of body section -->

</html>
<!-- End of HTML document -->
